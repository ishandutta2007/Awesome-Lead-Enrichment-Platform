<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 54px; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; letter-spacing: 0px; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    
    /* Dynamic pulsing animated background nodes */
    .pulse-circle-1 { animation: pulse1 4s ease-in-out infinite alternate; transform-origin: 1050px 100px; }
    .pulse-circle-2 { animation: pulse2 6s ease-in-out infinite alternate; transform-origin: 150px 240px; }
    .float-node { animation: float 5s ease-in-out infinite alternate; }

    @keyframes pulse1 {
      0% { transform: scale(0.9); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes pulse2 {
      0% { transform: scale(0.85); opacity: 0.2; }
      100% { transform: scale(1.1); opacity: 0.5; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Graphic Elements (Background layer - won't obscure text) -->
  <g opacity="0.4">
    <!-- Grid overlay pattern -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#334155" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#334155" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Glowing background dynamic tech circles -->
  <circle class="pulse-circle-1" cx="1050" cy="100" r="140" fill="url(#glow-grad)" opacity="0.3"/>
  <circle class="pulse-circle-2" cx="150" cy="240" r="100" fill="url(#accent-grad)" opacity="0.2"/>

  <!-- Tech Network Nodes (Right Side Graphic) -->
  <g class="float-node" stroke="url(#accent-grad)" stroke-width="2" fill="none" opacity="0.85">
    <line x1="880" y1="160" x2="960" y2="100" />
    <line x1="880" y1="160" x2="980" y2="210" />
    <line x1="960" y1="100" x2="1080" y2="120" />
    <line x1="980" y1="210" x2="1080" y2="120" />
    <line x1="980" y1="210" x2="1060" y2="240" />

    <circle cx="880" cy="160" r="8" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="960" cy="100" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <circle cx="980" cy="210" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <circle cx="1080" cy="120" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="1060" cy="240" r="5" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Decorative Top & Bottom Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)"/>
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent-grad)"/>

  <!-- Foreground Content (Text & Pill) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="55" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="76" class="tag" text-anchor="middle">🚀 B2B DATA &amp; SALES INTEL</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Lead Enrichment Platform ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Curated Ecosystem of SaaS Platforms, APIs &amp; Open-Source Tools</text>

    <!-- Feature Highlights Badges in Header -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
      <text x="82" y="23" fill="#ffffff" font-family="system-ui" font-weight="600" font-size="14" text-anchor="middle">🔍 Email &amp; Phone</text>
      
      <!-- Badge 2 -->
      <rect x="180" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="267" y="23" fill="#ffffff" font-family="system-ui" font-weight="600" font-size="14" text-anchor="middle">🏢 Firmographics</text>

      <!-- Badge 3 -->
      <rect x="370" y="0" width="185" height="36" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
      <text x="462" y="23" fill="#ffffff" font-family="system-ui" font-weight="600" font-size="14" text-anchor="middle">🌊 Waterfall Engine</text>
    </g>
  </g>
</svg>
